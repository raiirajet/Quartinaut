<body>
  <a class="v48-skip-link" href="#main">Zum Hauptinhalt springen</a>
  <noscript>Diese App benötigt JavaScript.</noscript>

  <div id="app" class="app-shell">
    <header class="topbar" aria-label="Website Kopfbereich">
      <button id="qn-back" class="icon-button" type="button" aria-label="Einen Schritt zurück" hidden>←</button><button class="brand reset-button" data-route="home" aria-label="Zur Startseite">
        <span class="v2-brand-logo-frame" aria-hidden="true"><img class="v2-brand-logo" src="./assets/native/quartinaut-brand.svg" alt="" width="70" height="50" decoding="async" fetchpriority="high"></span>
        <span class="brand-copy">
          <strong>Quartinaut</strong>
          <small>Deine Schweizer Gemeindeplattform</small>
        </span>
        <span class="qn-brand-desktop"><strong>Quartinaut</strong><small>Gemeinsam in deiner Nähe</small></span>
      </button>
      <nav class="qn-desktop-nav" aria-label="Seitennavigation">
        <button type="button" data-qn-nav="home">Start</button>
        <button type="button" data-qn-nav="hub">Entdecken</button>
        <button type="button" data-qn-nav="chats">Nachrichten</button>
        <button type="button" data-qn-nav="create" class="primary-button">Eintrag erstellen</button>
      </nav>
      <div class="top-actions"><button id="qn-search" class="icon-button" type="button" aria-label="Suche öffnen">⌕</button>
        <button class="icon-button top-theme" id="themeButton" type="button" aria-label="Darstellung wechseln" title="Darstellung wechseln">
          <svg class="touch-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
        </button>
        <button class="icon-button top-help" id="helpButton" aria-label="Hilfe und Änderungsanfragen" title="Hilfe und Änderungsanfragen">
          <svg class="touch-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 9a2.7 2.7 0 1 1 4.35 2.1c-.97.69-1.85 1.35-1.85 2.65"></path><path d="M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>
        </button>
        <div class="header-auth-actions" id="headerAuthActions">
          <button class="primary-button small" id="headerRegisterButton" type="button">Konto erstellen</button>
          <button class="ghost-button small" id="headerLoginButton" type="button">Anmelden</button>
        </div>
        <button class="icon-button v21-inbox-shortcut" data-community-route="inbox" type="button" aria-label="Mitteilungen anzeigen" hidden>
          <svg class="touch-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg><span class="v21-inbox-count" hidden></span>
        </button>
        <button class="icon-button v2-profile-link" data-route="profile" type="button" aria-label="Mein Profil öffnen" title="Mein Profil" hidden>
          <svg class="touch-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-5 3.5-8 8-8s8 3 8 8"></path></svg>
        </button>
        <button class="ghost-button small" id="logoutButton" hidden="">
          <svg class="touch-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 6H6v12h4"></path><path d="M14 8l4 4-4 4"></path><path d="M18 12H9"></path></svg>
          <span>Abmelden</span>
        </button>
      </div>
    </header>

    <div id="permissionBanner" class="permission-banner" hidden></div>
    <div id="v2Connectivity" class="v2-connectivity" role="status" aria-live="polite" hidden></div>
    <main id="main" class="main" tabindex="-1"></main>
    <footer class="legal-footer" aria-label="Rechtliche Informationen"><a class="ghost-button small" href="https://github.com/raiirajet/Quartinaut/releases/tag/android-v33-preview" target="_blank" rel="noopener noreferrer">Android-App herunterladen</a>
      <button class="ghost-button small" data-action="open-legal" data-legal="privacy" type="button">Datenschutz</button>
      <button class="ghost-button small" data-action="open-legal" data-legal="terms" type="button">Nutzungsbedingungen</button>
      <button class="ghost-button small" data-action="open-legal" data-legal="imprint" type="button">Impressum</button>
    </footer>

    <nav class="bottom-nav v2-bottom-nav v4-nav v41-nav" data-nav-style="glass3d" aria-label="Hauptnavigation">
      <button data-route="home" class="nav-item active" aria-label="Startseite"><span class="v41-nav-icon-shell"><span class="qn-icon" aria-hidden="true" style="--ix:0;--iy:0"></span></span><small>Start</small></button>
      <button data-qn-nav="hub" class="nav-item" aria-label="Quartier+"><span class="v41-nav-icon-shell"><span class="qn-icon" aria-hidden="true" style="--ix:1;--iy:0"></span></span><small>Quartier+</small></button>
      <button data-qn-nav="create" class="nav-item v2-create-nav" type="button" aria-label="Neuen Beitrag erstellen"><span class="v41-nav-icon-shell"><span class="qn-icon" aria-hidden="true" style="--ix:2;--iy:0"></span></span><small>Neu</small></button>
      <button data-qn-nav="chats" class="nav-item" aria-label="Nachrichten"><span class="v41-nav-icon-shell"><span class="qn-icon" aria-hidden="true" style="--ix:0;--iy:1"></span></span><small>Nachrichten</small></button>
      <button data-route="profile" class="nav-item" aria-label="Profil"><span class="v41-nav-icon-shell"><span class="qn-icon" aria-hidden="true" style="--ix:0;--iy:5"></span></span><small>Profil</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>


  <template id="modalTemplate">
    <div class="modal-backdrop" role="presentation">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header">
          <h2 id="modalTitle"></h2>
          <button class="icon-button" data-close-modal="" aria-label="Schliessen">×</button>
        </header>
        <div class="modal-body"></div>
      </section>
    </div>
  </template>

  <script src="./firebase-config.js"></script>
  <script src="./assets/native/coats-index.js"></script>
  <script src="./vendor/qrcode-1.4.4.js"></script>
