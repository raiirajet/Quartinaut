name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/native-android-v1'
    runs-on: ubuntu-24.04
    env:
      QUARTINAUT_KEYSTORE_PASSWORD: ${{ secrets.QUARTINAUT_KEYSTORE_PASSWORD }}
      QUARTINAUT_KEY_ALIAS: ${{ secrets.QUARTINAUT_KEY_ALIAS }}
      QUARTINAUT_KEY_PASSWORD: ${{ secrets.QUARTINAUT_KEY_PASSWORD }}
      # Public certificate pin; the private key is stored only in Secrets.
      QUARTINAUT_SIGNING_SHA256: A7F498276029BC545335FA8D9A12140FF5FEEEB215AC97AA9F4193F1BBE3F6AE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require and prepare private signing key
        env:
          QUARTINAUT_KEYSTORE_FILE: ${{ runner.temp }}/quartinaut-release.jks
          QUARTINAUT_KEYSTORE_BASE64: ${{ secrets.QUARTINAUT_KEYSTORE_BASE64 }}
        run: |
          echo "QUARTINAUT_KEYSTORE_FILE=$QUARTINAUT_KEYSTORE_FILE" >> "$GITHUB_ENV"
          python3 scripts/prepare-release-keystore.py
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BIN="$(find "$SDK" -type f -name sdkmanager -print -quit)"
          test -n "$BIN"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$BIN" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Restore original artwork and location snapshot
        run: bash scripts/sync-original-assets.sh
      - name: Bundle pinned offline municipality geometry
        run: |
          mkdir -p app/src/main/assets/geo
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            'https://raw.githubusercontent.com/samkhavandi/Swiss_Geography_Look_Ups/56fc51958e8cce0e0e7c2615f3ac28aef369f7ae/geometries/municipality_2025.geojson' \
            -o app/src/main/assets/geo/municipality_2025.geojson
          python3 -c 'import json; d=json.load(open("app/src/main/assets/geo/municipality_2025.geojson")); assert d.get("type")=="FeatureCollection" and len(d.get("features",[]))>=2000'
      - name: Verify complete offline coats and municipal logo
        run: |
          python3 scripts/sync-wappen-assets.py
          python3 scripts/verify-wappen-assets.py
      - name: Assemble signed APK and App Bundle
        run: gradle :app:assembleRelease :app:bundleRelease :app:testReleaseUnitTest --no-daemon --max-workers=4 --stacktrace
      - name: Verify release certificate and package artifacts
        run: |
          python3 scripts/verify-release-apk.py \
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          mkdir -p artifacts/release
          cp app/build/outputs/apk/release/app-release.apk artifacts/release/Quartinaut-Android-Release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/release/Quartinaut-Android-Release.aab
          cd artifacts/release
          sha256sum Quartinaut-Android-Release.apk Quartinaut-Android-Release.aab > SHA256SUMS
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quartinaut-Signed-Release
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary private keystore
        if: always()
        env:
          QUARTINAUT_KEYSTORE_FILE: ${{ runner.temp }}/quartinaut-release.jks
        run: rm -f -- "$QUARTINAUT_KEYSTORE_FILE"
