name: Android native debug APK
on:
  push:
    branches: [native-android-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 35
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BIN="$(find "$SDK" -type f -name sdkmanager -print -quit 2>/dev/null)"
          echo "SDK=$SDK / sdkmanager=$BIN"
          if [ -z "$BIN" ]; then echo "::error::Android SDK commandline tools not available"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$BIN" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK (native)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quartinaut-Native-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
