name: Android native debug APK
on:
  push:
    branches: [native-android-v1]
  workflow_dispatch:
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.12'
      - name: SDK 35
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BIN="$(find "$SDK" -type f -name sdkmanager -print -quit 2>/dev/null)"
          echo "SDK=$SDK / sdkmanager=$BIN"
          if [ -z "$BIN" ]; then echo "::error::Android SDK commandline tools not available"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$BIN" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original Quartinaut 5.4 artwork and location snapshot
        run: bash scripts/sync-original-assets.sh
      - name: Verify private image-service code and validation tests
        run: |
          node --check functions/appearance/index.js
          node --test functions/appearance/test/validation.test.js
      - name: Verify private chat security and message validation
        run: |
          node --check functions/nativeChats/index.js
          node --test functions/nativeChats/test/security.test.js
      - name: Verify community extensions security validation
        run: |
          node --check functions/enhancements/index.js
          node --test functions/enhancements/test/validators.test.js
      - name: Verify Firestore and Storage rules in emulators
        run: |
          npm ci --prefix firebase/rules-tests
          npx -y firebase-tools@latest emulators:exec --only firestore,storage \
            --project demo-quartinaut-rules "npm --prefix firebase/rules-tests test"
      - name: Assemble debug APK (native)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Package native Android Studio sources and original images
        run: |
          zip -q -r Quartinaut_Native_Quellcode.zip \
            README.md ANDROID_STATUS.md AUDIT_NATIVE_54_2026-11-13.md FIREBASE_NATIVE_FOUNDATION.md .gitignore \
            settings.gradle.kts build.gradle.kts gradle.properties firebase.json .firebaserc \
            scripts app/build.gradle.kts app/google-services.json app/src firebase \
            functions/appearance functions/nativeChats functions/enhancements \
            firebase.appearance.json firebase.chats.json firebase.enhancements.json web-bridge \
            -x 'firebase/rules-tests/node_modules/*'
      - name: Upload native source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Quartinaut-Native-Quellcode
          path: Quartinaut_Native_Quellcode.zip
          retention-days: 30
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quartinaut-Native-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

